<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Littlebird Pad Hopper</title>
  <meta name="description" content="A light-helicopter flight sim in the browser: collective, cyclic, pedals, momentum, miniguns and missiles, solo or multiplayer deathmatch.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<div id="view"></div>
<div id="vignette" class="hud"></div>

<div id="top" class="hud">
  <div id="tl">
    <div class="brand"><strong>Littlebird Pad Hopper</strong><span>MH-6 class · 8.3 m rotor</span></div>
    <div class="row">
      <span class="lbl group-lbl">Assists</span>
      <button class="tg" data-assist="stability" aria-pressed="true"><span class="led"></span>Stability<kbd data-key="toggleStability"></kbd></button>
      <button class="tg" data-assist="autoHover" aria-pressed="true"><span class="led"></span>Auto-hover<kbd data-key="toggleAutoHover"></kbd></button>
      <button class="tg" data-assist="envelope" aria-pressed="true"><span class="led"></span>Envelope limits<kbd data-key="toggleEnvelope"></kbd></button>
      <button class="tg" data-assist="turnCoord" aria-pressed="true"><span class="led"></span>Turn coord<kbd data-key="toggleTurnCoord"></kbd></button>
    </div>
    <div class="row">
      <button class="tg" id="bFly"><span class="led"></span>Fly fullscreen</button>
      <button class="tg" id="bMouse" aria-pressed="false"><span class="led"></span>Mouse control</button>
      <button class="tg" id="bCam"><span>Cam: Cockpit</span><kbd data-key="camera"></kbd></button>
      <button class="tg" id="bReset">Reset<kbd data-key="reset"></kbd></button>
      <button class="tg" id="bSound" aria-pressed="false"><span class="led"></span>Sound<kbd data-key="sound"></kbd></button>
      <button class="tg" id="bSettings">Settings<kbd data-key="settings"></kbd></button>
    </div>
  </div>
  <div id="side">
    <div id="mapWrap" class="panel">
      <canvas id="minimap" width="400" height="400" aria-label="Minimap"></canvas>
      <span id="mapRange" class="lbl"></span>
    </div>
    <div class="panel mp" id="mpPanel" hidden>
      <div class="lbl">Room <span id="mpRoomName"></span> <span id="mpPing"></span></div>
      <table id="mpList"></table>
    </div>
    <div class="panel mp" id="soloPanel">
      <div class="lbl">Practice targets destroyed <span id="soloScore" class="num sm">0</span></div>
    </div>
    <ul id="feed" aria-live="polite"></ul>
  </div>
</div>

<svg id="hudsvg" class="hud" viewBox="-280 -175 560 350" aria-hidden="true">
  <rect class="st thin" x="-192" y="-80" width="10" height="160"/>
  <line class="st" x1="-197" y1="0" x2="-177" y2="0"/>
  <rect id="colBar" class="amb" x="-191" y="0" width="8" height="0"/>
  <line id="thrTick" class="st thrust" x1="-197" y1="0" x2="-177" y2="0"/>
  <text class="sm" x="-187" y="98" text-anchor="middle">COLL</text>
  <text class="sm" x="-210" y="-14" text-anchor="end">SPD km/h</text>
  <text id="tSpd" class="big" x="-210" y="12" text-anchor="end">0</text>
  <text class="sm" x="196" y="-14">ALT AGL m</text>
  <text id="tAgl" class="big" x="196" y="12">0</text>
  <text class="sm" x="196" y="38">ASL</text>
  <text id="tAsl" class="md" x="222" y="38">0</text>
  <text class="sm" x="196" y="58">V/S</text>
  <text id="tVs" class="md" x="222" y="58">0.0</text>
  <text class="sm" x="-120" y="150" text-anchor="middle">HDG</text>
  <text id="tHdg" class="md" x="-120" y="166" text-anchor="middle">000</text>
  <text class="sm" x="-40" y="150" text-anchor="middle">ROTOR</text>
  <text id="tRpm" class="md" x="-40" y="166" text-anchor="middle">0%</text>
  <text class="sm" x="40" y="150" text-anchor="middle">HULL</text>
  <text id="tHull" class="md" x="40" y="166" text-anchor="middle">100%</text>
  <text class="sm" x="120" y="150" text-anchor="middle">BANK</text>
  <text id="tBank" class="md" x="120" y="166" text-anchor="middle">0°</text>
</svg>
<div id="tags" class="hud"><span id="tagIge">IGE</span><span id="tagEtl">ETL</span><span id="tagAlt">ALT HOLD</span><span id="tagAtt">ATT HOLD</span><span id="tagCrd">TURN COORD</span><span id="tagEnv">ENV LIMIT</span></div>

<div id="weapons" class="hud"><span id="wGun" class="on">GUN 3000</span><span id="wMsl">MSL 4</span><span id="wFlr">FLR 30</span></div>

<div id="pipper" class="hud aim" hidden></div>
<div id="hitMark" class="hud aim" hidden></div>
<div id="seeker" class="hud aim" hidden></div>
<div id="lockBox" class="hud aim" hidden>
  <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="4" width="40" height="40"/><circle id="lockRing" cx="24" cy="24" r="20" transform="rotate(-90 24 24)"/></svg>
  <span>LOCK</span>
</div>
<div id="warn" class="hud" hidden></div>

<div id="msg" class="hud"><div id="m1"></div><div id="m2"></div></div>

<div id="menu" hidden>
  <div class="card" role="dialog" aria-labelledby="menuTitle">
    <div class="menu-head">
      <h2 id="menuTitle">Fly and fight</h2>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="help">Help</button>
        <button role="tab" data-tab="controls">Controls</button>
        <button role="tab" data-tab="assists">Assists</button>
        <button role="tab" data-tab="mouse">Mouse</button>
        <button role="tab" data-tab="multiplayer">Multiplayer</button>
      </div>
    </div>
    <div id="menuBody"></div>
    <div class="menu-row">
      <button class="go" id="menuFly">Fly fullscreen</button>
      <button class="tg" id="menuWindow">Play in window</button>
    </div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
